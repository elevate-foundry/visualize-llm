services:
  app:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface
    environment:
      - DEVICE=cpu
      - MODEL_NAME=Qwen/Qwen3-0.6B
      - LOCAL_FILES_ONLY=false
    # Uncomment for GPU support (requires nvidia-docker):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  hf-cache:
